<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Song Ambient — music among the stars</title>
<desc id="desc">Concept illustration of a music-reactive glowing border and individual words linked into a constellation. Free and open source for macOS.</desc>
<defs>
<linearGradient id="rim" x2="1" y2="1"><stop stop-color="#75dfff"/><stop offset=".5" stop-color="#927cff"/><stop offset="1" stop-color="#ff91bd"/></linearGradient>
<radialGradient id="sky"><stop stop-color="#181c3c"/><stop offset="1" stop-color="#080c17"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="star"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="650" rx="32" fill="#070a12"/>
<rect x="24" y="24" width="1152" height="602" rx="27" fill="url(#sky)"/>
<rect x="24" y="24" width="1152" height="602" rx="27" fill="none" stroke="url(#rim)" stroke-width="14" opacity=".7" filter="url(#glow)"/>
<path d="M50 24H1150Q1176 24 1176 50V600Q1176 626 1150 626H50Q24 626 24 600V50Q24 24 50 24Z" fill="none" stroke="url(#rim)" stroke-width="3"/>
<g fill="#8995b9" opacity=".55">
<circle cx="104" cy="198" r="1.5"/><circle cx="217" cy="135" r="1"/><circle cx="361" cy="240" r="1.3"/><circle cx="546" cy="142" r="1"/><circle cx="690" cy="210" r="1.5"/><circle cx="940" cy="144" r="1"/><circle cx="1086" cy="270" r="1.6"/><circle cx="1025" cy="489" r="1"/><circle cx="769" cy="482" r="1.3"/><circle cx="430" cy="520" r="1"/><circle cx="130" cy="480" r="1.5"/><circle cx="322" cy="373" r="1"/><circle cx="853" cy="333" r="1.4"/>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
<text x="65" y="80" fill="#edf3ff" font-size="22" font-weight="600">Song Ambient</text>
<text x="65" y="106" fill="#8b98bb" font-size="13" letter-spacing="2">YOUR MUSIC. AROUND YOUR SCREEN.</text>
<rect x="990" y="60" width="145" height="30" rx="15" fill="#14232d" stroke="#3a5968"/>
<text x="1062" y="80" fill="#a9edff" font-size="12" text-anchor="middle" letter-spacing="1">FREE · MIT</text>
<path d="M205 310L465 432L632 236L925 344" fill="none" stroke="#7dd8ff" stroke-width="1.2" opacity=".45"/>
<path d="M205 310L632 236L925 344M465 432L925 344" fill="none" stroke="#848dcb" stroke-width=".6" opacity=".18"/>
<g fill="#9ee3ff" filter="url(#star)"><circle cx="205" cy="310" r="7"/><circle cx="465" cy="432" r="7"/><circle cx="632" cy="236" r="7"/><circle cx="925" cy="344" r="10"/></g>
<g fill="#d5f4ff"><circle cx="205" cy="310" r="2.5"/><circle cx="465" cy="432" r="2.5"/><circle cx="632" cy="236" r="2.5"/><circle cx="925" cy="344" r="3.5"/></g>
<circle cx="925" cy="344" r="18" stroke="#91ddff" fill="none" opacity=".4"/>
<text x="205" y="287" fill="#909ab5" font-size="26" text-anchor="middle">Music</text>
<text x="465" y="470" fill="#a0accb" font-size="29" text-anchor="middle">among</text>
<text x="632" y="212" fill="#b9c5e2" font-size="28" text-anchor="middle">the</text>
<text x="925" y="314" fill="#e4f7ff" font-size="53" font-weight="600" text-anchor="middle">stars</text>
<text x="65" y="565" fill="#d8e4fa" font-size="18">Six edge effects. Nine lyric looks. One native Mac app.</text>
<text x="65" y="591" fill="#8b98bb" font-size="13">Spotify only · Bass-reactive light · Word-motion lyrics · macOS 15+</text>
<text x="1135" y="590" fill="#7584a5" font-size="11" text-anchor="end" letter-spacing="2">CONSTELLATION / ILLUSTRATION</text>
</g>
</svg>
